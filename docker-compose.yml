services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: widgetplatform
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widgetplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://widget:widget@db:5432/widgetplatform
      JWT_SECRET: local-development-secret
      API_BASE_URL: http://localhost:8000
      WIDGET_VERSION: v1
      CORS_ALLOW_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      GEO_PROVIDER_A_URL: https://ip-api.com/json/{ip}
      GEO_PROVIDER_B_URL: https://ipapi.co/{ip}/json/
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
