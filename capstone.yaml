run: docker compose up --build
test: pytest -q
seed: curl -X POST http://localhost:8000/auth/register -H 'Content-Type: application/json' -d '{"email":"demo@example.com","password":"password123"}'
base_url: http://localhost:8000
endpoints:
  - POST /auth/register
  - POST /auth/login
  - POST /widgets
  - GET /widgets/{id}/snippet
  - GET /widgets/{id}/config
  - POST /submissions?widget_id={id}
  - GET /dashboard/submissions
  - GET /dashboard/stats
